name: Build HMKPM KPM

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (with KPM-Headers submodule)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Submodule download can silently leave KPM-Headers empty.
      # If that happens, pull the headers straight from the source repo.
      - name: Ensure KPM-Headers (fallback clone if submodule is empty)
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f "KPM-Headers/include/kpmodule.h" ]; then
            echo "[!] KPM-Headers submodule is empty - cloning manually"
            rm -rf KPM-Headers
            git clone --depth 1 --branch KPM-Headers \
              https://github.com/Yervant7/KPM-Manager.git KPM-Headers
          fi
          test -f "KPM-Headers/include/kpmodule.h"
          test -f "KPM-Headers/patch/include/syscall.h"
          test -f "KPM-Headers/linux/include/uapi/asm-generic/unistd.h"
          echo "[+] KPM-Headers OK"

      - name: Install ARM GNU Toolchain (aarch64-none-elf, 12.2.rel1)
        shell: bash
        run: |
          set -euo pipefail
          curl -fL -o arm-gnu-toolchain.tar.xz \
            https://armkeil.blob.core.windows.net/developer/Files/downloads/gnu/12.2.rel1/binrel/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf.tar.xz
          tar -xJf arm-gnu-toolchain.tar.xz
          ls -d arm-gnu-toolchain-*/
          echo "$(pwd)/arm-gnu-toolchain-12.2.rel1-x86_64-aarch64-none-elf/bin" >> "$GITHUB_PATH"

      - name: Verify compiler
        shell: bash
        run: |
          aarch64-none-elf-gcc --version | head -1
          aarch64-none-elf-ld --version | head -1

      - name: Extract version from source
        id: vars
        shell: bash
        run: |
          VERSION=$(grep -oP 'KPM_VERSION\(\"?\K[^")]+' hmkpm.c)
          if [ -z "$VERSION" ]; then
            echo "ERROR: Could not extract version from hmkpm.c"
            exit 1
          fi
          echo "Extracted version: $VERSION"
          echo "VERSION=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build KPM
        shell: bash
        run: |
          make clean
          make -j"$(nproc)"
          if [ ! -f hmkpm.kpm ]; then
            echo "ERROR: hmkpm.kpm not found after build"
            exit 1
          fi
          ls -la hmkpm.kpm
          file hmkpm.kpm || true

      - name: Upload hmkpm.kpm artifact
        uses: actions/upload-artifact@v4
        with:
          name: hmkpm-${{ steps.vars.outputs.VERSION }}
          path: |
            hmkpm.kpm
          if-no-files-found: error

      - name: Create / Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: ncipollo/release-action@v1.21.0
        with:
          tag: ${{ steps.vars.outputs.VERSION }}
          name: Release ${{ steps.vars.outputs.VERSION }}
          artifacts: |
            hmkpm.kpm
            LICENSE
          token: ${{ secrets.GITHUB_TOKEN }}
          allowUpdates: true
          makeLatest: true
          replacesArtifacts: true
